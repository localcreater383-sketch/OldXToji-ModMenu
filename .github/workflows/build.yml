name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fix App Folder Structure
        run: |
          mkdir -p app
          if [ -f app.zip ]; then
            unzip -o app.zip -d app/
          fi
          # Agar files bahar root mein hain toh unhe app folder mein move kar do
          if [ -d src ]; then
            mv src app/
          fi
          if [ -f build.gradle ]; then
            # Check karo ke kya ye app level ki build.gradle hai
            mv build.gradle app/ 2>/dev/null || true
          fi
          ls -la
          ls -la app/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OldXToji-ModMenu-APK
          path: '**/build/outputs/apk/debug/*.apk'
